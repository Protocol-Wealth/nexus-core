[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-core"
version = "0.1.0"
description = "Open source regime-adaptive financial analysis engine with MCP tool orchestration"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Protocol Wealth, LLC", email = "opensource@protocolwealthllc.com" },
    { name = "Nicholas Rygiel", email = "nick@protocolwealthllc.com" },
]
keywords = [
    "finance",
    "portfolio",
    "mcp",
    "ria",
    "sec",
    "compliance",
    "wealth-management",
    "regime-detection",
    "fintech",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

# ─── Core dependencies (required) ───────────────────────────────────
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn>=0.50.2",
    "pydantic>=2.13.4",
    "httpx>=0.28.1",
    "structlog>=26.1.0",
    "asyncpg>=0.31.0",
    # alphalens-reloaded (the [backtest] extra) caps pandas<3.0 — pandas 3.0
    # broke it and there is no pandas-3-compatible release — so the whole
    # project pins pandas<3.0 to keep [all]/[backtest] installable + working.
    # The core engine uses no pandas-3-only API (verified), so this is a no-op
    # for the deployed surface. Lift the cap if/when alphalens-reloaded ships
    # pandas-3 support.
    "pandas>=2.2,<3.0",
    "numpy>=2.5.0",
    "scipy>=1.18.0",
]

# ─── Optional dependencies (install with extras) ────────────────────
[project.optional-dependencies]

# Portfolio optimization
optimization = [
    "PyPortfolioOpt>=1.6.0",   # MIT
    "Riskfolio-Lib>=7.3.0",    # BSD-3
    "skfolio>=0.20.1",          # BSD-3
]

# Risk analytics
risk = [
    "empyrical-reloaded>=0.5.12",  # Apache 2.0
    "pyfolio-reloaded>=0.9.9",     # Apache 2.0
    "ffn>=1.1.5",                  # MIT
]

# Derivatives pricing
pricing = [
    "QuantLib>=1.42.1",            # Modified BSD
    "financepy>=1.0.1",            # MIT
]

# SEC EDGAR integration
edgar = [
    "edgartools>=5.40.1",          # MIT — built-in MCP server
    "arelle-release>=2.41.6",      # Apache 2.0 (XBRL validation)
    "sec-parser>=0.58.1",           # MIT
    "sec-edgar-downloader>=5.1.0", # MIT
]

# Market data
market = [
    "yfinance>=1.5.1",            # Apache 2.0
]

# Model Context Protocol server (MCP-over-HTTP transport)
mcp = [
    "fastmcp>=3.4.2,<4",           # Apache 2.0 (3.x: ToolAnnotations, extra_tools registration)
]

# Public deployment surface — HTTP API + MCP server (see nexus_core.app).
# fastapi + uvicorn are already core dependencies; this pulls the data and
# MCP extras the deployed app needs. PyPortfolioOpt powers the
# optimize_allocation planning tool on the public surface (the heavier
# Riskfolio-Lib / skfolio backends stay in the [optimization] extra).
serve = [
    "nexus-core[market,mcp]",
    "PyPortfolioOpt>=1.6.0",       # MIT — optimize_allocation planning tool
]

# AI/ML for finance
ai = [
    "finrl>=0.3.7",                # MIT (heavy: torch, gym)
    "transformers>=5.13.0",        # Apache 2.0 (for FinBERT)
    "torch>=2.12.1",                # BSD-3
]

# Backtesting
backtest = [
    "zipline-reloaded>=3.1.1",     # Apache 2.0
    "alphalens-reloaded>=0.4.6",   # Apache 2.0
]

# Compliance (OFAC screening, XBRL)
compliance = [
    "httpx>=0.28.1",               # Moov Watchman runs as separate service
]

# Onchain / DeFi
# The onchain data layer (data/onchain/*) reads via HTTP providers (DeBank /
# Tatum / TheGraph / Jupiter / DeFiLlama / etc.), not direct RPC — so web3 is
# the forward-looking dep for any future direct-RPC reader. ethereum-etl was
# removed: it is unused (nothing imports it) and its latest release (2.4.2)
# pins web3<6, which is irreconcilable with web3>=7.16.0 and made this extra
# (and [all]) unsatisfiable.
onchain = [
    "web3>=7.16.0",                 # MIT
]

# Planning / retirement simulation
planning = [
    "scipy>=1.18.0",               # already in core but listed for clarity
]

# Development tools
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "mypy>=2.1.0",
    "pip-licenses>=5.5.5",
]

# All capabilities (excluding dev)
all = [
    "nexus-core[optimization,risk,pricing,edgar,market,mcp,ai,backtest,compliance,onchain,planning]",
]

[project.urls]
Homepage = "https://nexusmcp.site"
Documentation = "https://github.com/Protocol-Wealth/nexus-core/tree/main/docs"
Repository = "https://github.com/Protocol-Wealth/nexus-core"
Issues = "https://github.com/Protocol-Wealth/nexus-core/issues"
Changelog = "https://github.com/Protocol-Wealth/nexus-core/blob/main/CHANGELOG.md"
"Patent" = "https://patentcenter.uspto.gov/applications/64034229"

[project.scripts]
nexus-core = "nexus_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nexus_core*"]

[tool.setuptools.package-data]
# Ship the canonical PlanningContract JSON-Schema (cross-language source of truth)
# alongside the wheel so adopters + the in-sync test can load it.
nexus_core = ["engine/planning/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PL"]
# Ignored rules:
#   E501 - line length handled by formatter
#   PLR0911/0912/0913/0915 - branch/statement/argument count (domain code
#       with many threshold comparisons is inherently branchy)
#   PLR2004 - magic values (thresholds are explicit on purpose)
#   UP042 - StrEnum is 3.11+ only; str + Enum works on all supported versions
#   PLC0415 - optional heavy deps (PyPortfolioOpt, Riskfolio, torch, QuantLib) are
#       lazy-imported inside functions on purpose, to keep them out of the core
#       import path; the extras system is the whole point. Top-level imports would
#       force the heavy deps on every `import nexus_core`.
ignore = [
    "E501",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "PLC0415",
    "UP042",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are called in argument defaults by design. Ruff's
# B008 default allowlist already covers Query/Path/Header/etc.; extend it to the
# JSON-body marker used by the options POST endpoints.
extend-immutable-calls = ["fastapi.Body"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no external deps)",
    "integration: Integration tests (may need services)",
    "slow: Slow tests (>5s)",
    "live: Tests hitting live APIs (skipped in CI)",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
