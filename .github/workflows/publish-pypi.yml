name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "release tag must match vX.Y.Z" >&2; exit 1; }
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"

      - name: Install release tooling
        run: python -m pip install build==1.5.0 twine==6.1.0 setuptools==83.0.0 wheel==0.47.0

      - name: Build distributions
        run: python -m build --no-isolation

      - name: Verify exact artifact inventory
        run: |
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          shopt -s nullglob
          wheels=(dist/pw_nexus_core-*-py3-none-any.whl)
          sdists=(dist/pw_nexus_core-*.tar.gz)
          artifacts=(dist/*)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          test "${#artifacts[@]}" -eq 2
          test "${wheels[0]##*/}" = "pw_nexus_core-${PACKAGE_VERSION}-py3-none-any.whl"
          test "${sdists[0]##*/}" = "pw_nexus_core-${PACKAGE_VERSION}.tar.gz"

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test the wheel
        run: |
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python -m venv /tmp/pw-nexus-core-smoke
          WHEEL=$(printf '%s\n' dist/*.whl)
          /tmp/pw-nexus-core-smoke/bin/python -m pip install "${WHEEL}[serve]"
          /tmp/pw-nexus-core-smoke/bin/python -c "import nexus_core; assert nexus_core.__version__ == '$PACKAGE_VERSION'"
          /tmp/pw-nexus-core-smoke/bin/nexus-core --help >/dev/null

      - name: Upload verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish trusted release
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pw-nexus-core
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: python-distributions
          path: dist/

      - name: Re-verify exact artifact inventory
        run: |
          shopt -s nullglob
          wheels=(dist/pw_nexus_core-*-py3-none-any.whl)
          sdists=(dist/pw_nexus_core-*.tar.gz)
          artifacts=(dist/*)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          test "${#artifacts[@]}" -eq 2
          WHEEL_NAME=${wheels[0]##*/}
          VERSION=${WHEEL_NAME#pw_nexus_core-}
          VERSION=${VERSION%-py3-none-any.whl}
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${sdists[0]##*/}" = "pw_nexus_core-${VERSION}.tar.gz"

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: dist/
          print-hash: true
