name: Deploy

# Continuous deployment: every merge to main ships the nexus-core Cloud Run
# service, the way pw-api, pw-os-v2 and pw-portal-v2 do. Before this, the
# service was deployed by hand (`gcloud run deploy --source`), so a merged
# engine fix stayed out of production until someone ran that command.
#
# No path filter: the image COPYs README.md, LICENSE and NOTICE as well as src/,
# so a markdown-only change can still change the image.
#
# The deploy changes the IMAGE ONLY. Every env var, secret reference, VPC,
# Cloud SQL and scaling setting already on the service is kept as it is.
#
# Rollout is a canary: the new revision is created with NO traffic and a tag,
# /health is checked on the tag URL, and only then does traffic move to it.
# A failed smoke check leaves the current revision serving. Moving traffic sets
# 100% on the new revision, which also clears any manual traffic split.
#
# Identity: nexus-core-deployer@pwllc-shared (pw-infrastructure#892,
# terraform/app-deployers/nexus-core-deployer.tf), reachable only from
# refs/heads/main of this repository through the GitHub WIF provider.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "I confirm this run should deploy nexus-core to production."
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: pwllc-prod
  REGION: us-central1
  SERVICE: nexus-core
  # The repository the live revision already pulls from (created by
  # `gcloud run deploy --source`, imported in pw-infrastructure bootstrap).
  IMAGE_REPO: us-central1-docker.pkg.dev/pwllc-prod/cloud-run-source-deploy/nexus-core
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # The pre-deploy gate IS ci.yml (ruff, mypy --strict, pytest with the
  # coverage floor), called on this commit rather than copied here.
  gate:
    name: Pre-deploy gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Build image + canary deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: gate
    if: >-
      github.ref == 'refs/heads/main' &&
      ( github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == true) )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      # A re-run of an older run, or a run queued behind a newer merge, must not
      # put an older commit back into production. Skip (not fail) when this
      # commit is no longer the head of main.
      - name: Refuse a stale commit
        id: fresh
        run: |
          set -euo pipefail
          HEAD_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::Could not read the head of main."
            exit 1
          fi
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_SHA is not the head of main ($HEAD_SHA); skipping so an older commit is not redeployed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud (WIF)
        if: steps.fresh.outputs.deploy == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/849960870306/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: nexus-core-deployer@pwllc-shared.iam.gserviceaccount.com

      - name: Set up gcloud
        if: steps.fresh.outputs.deploy == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Configure Docker for Artifact Registry
        if: steps.fresh.outputs.deploy == 'true'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image
        if: steps.fresh.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_REPO}:${IMAGE_TAG}"
          docker build --provenance=false --sbom=false --tag "$IMAGE" .
          docker push "$IMAGE"
          # Cloud Run records a revision's image by digest, so compare digests.
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          DIGEST="${DIGEST##*@}"
          if [ -z "$DIGEST" ]; then
            echo "::error::Could not read the pushed image's digest."
            exit 1
          fi
          echo "IMAGE=${IMAGE_REPO}@${DIGEST}" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          # If the registry holds an index, Cloud Run records the platform
          # manifest inside it; accept those child digests too.
          CHILDREN=$(docker buildx imagetools inspect --raw "${IMAGE_REPO}@${DIGEST}" | jq -r '[.manifests[]?.digest] | join(" ")')
          echo "IMAGE_CHILD_DIGESTS=$CHILDREN" >> "$GITHUB_ENV"
          echo "CANARY_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Create the new revision with no traffic
        if: steps.fresh.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run services update "$SERVICE" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --image="$IMAGE" \
            --no-traffic \
            --tag="$CANARY_TAG" \
            --quiet
          SVC_JSON=$(gcloud run services describe "$SERVICE" \
            --region="$REGION" --project="$PROJECT_ID" --format=json)
          REVISION=$(jq -r --arg t "$CANARY_TAG" '[.status.traffic[] | select(.tag == $t)][0].revisionName // empty' <<<"$SVC_JSON")
          TAG_URL=$(jq -r --arg t "$CANARY_TAG" '[.status.traffic[] | select(.tag == $t)][0].url // empty' <<<"$SVC_JSON")
          if [ -z "$REVISION" ] || [ -z "$TAG_URL" ]; then
            echo "::error::Could not read the tagged revision or its URL."
            exit 1
          fi
          REV_IMAGE=$(gcloud run revisions describe "$REVISION" \
            --region="$REGION" --project="$PROJECT_ID" \
            --format='value(spec.containers[0].image)')
          _REPO="${REV_IMAGE%@*}"; _REPO="${_REPO%:*}"
          _D="${REV_IMAGE##*@}"
          if [ "$_REPO" != "$IMAGE_REPO" ] || { [ "$_D" != "$IMAGE_DIGEST" ] && ! grep -qw "$_D" <<<"$IMAGE_CHILD_DIGESTS"; }; then
            echo "::error::Tagged revision $REVISION runs $REV_IMAGE, not $IMAGE."
            exit 1
          fi
          echo "NEW_REVISION=$REVISION" >> "$GITHUB_ENV"
          echo "TAG_URL=$TAG_URL" >> "$GITHUB_ENV"
          echo "Created $REVISION (no traffic) at $TAG_URL"

      - name: Smoke check /health on the new revision
        if: steps.fresh.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${TAG_URL}/health" || true)
            if [ "$CODE" = "200" ]; then
              echo "/health returned 200 on $NEW_REVISION"
              exit 0
            fi
            echo "attempt $attempt: /health returned ${CODE:-no response}; retrying"
            sleep 10
          done
          echo "::error::/health never returned 200 on $NEW_REVISION; traffic was not moved."
          exit 1

      - name: Move all traffic to the new revision
        if: steps.fresh.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$SERVICE" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --to-revisions="$NEW_REVISION=100" \
            --quiet
          # Positive check on what serves: 100% of traffic on the new revision,
          # and that revision runs this build's image.
          SERVING=$(gcloud run services describe "$SERVICE" \
            --region="$REGION" --project="$PROJECT_ID" --format=json \
            | jq -r '[.status.traffic[] | select((.percent // 0) == 100)][0].revisionName // empty')
          if [ "$SERVING" != "$NEW_REVISION" ]; then
            echo "::error::100% of traffic is on '${SERVING:-none}', not $NEW_REVISION."
            exit 1
          fi
          SERVING_IMAGE=$(gcloud run revisions describe "$SERVING" \
            --region="$REGION" --project="$PROJECT_ID" \
            --format='value(spec.containers[0].image)')
          _REPO="${SERVING_IMAGE%@*}"; _REPO="${_REPO%:*}"
          _D="${SERVING_IMAGE##*@}"
          if [ "$_REPO" != "$IMAGE_REPO" ] || { [ "$_D" != "$IMAGE_DIGEST" ] && ! grep -qw "$_D" <<<"$IMAGE_CHILD_DIGESTS"; }; then
            echo "::error::Serving revision $SERVING runs $SERVING_IMAGE, not $IMAGE."
            exit 1
          fi
          echo "100% of traffic on $SERVING ($SERVING_IMAGE)"
